name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "Strong@Pass123"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Strong@Pass123 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Wait for SQL Server to be ready
        run: |
          echo "Waiting for SQL Server to be ready..."
          for i in {1..30}; do
            /opt/mssql-tools/bin/sqlcmd -S db -U sa -P Strong@Pass123 -Q "SELECT 1" && break
            echo "Waiting..."
            sleep 5
          done

      - name: Restore dependencies
        run: dotnet restore ProjectManagement.sln

      - name: Build solution
        run: dotnet build ProjectManagement.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ProjectManagement.sln --no-build --configuration Release --logger "trx;LogFileName=test_results.trx"

      - name: Publish API (optional)
        run: dotnet publish ProjectManagement.Api/ProjectManagement.Api.csproj --configuration Release --output ./publish

      - name: Build Docker images
        run: docker-compose -f docker-compose.yml build

      - name: Run Docker Compose (optional for integration tests)
        run: docker-compose -f docker-compose.yml up -d
