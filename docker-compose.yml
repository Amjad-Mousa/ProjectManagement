version: '3.9'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: projectmanagement-db
    environment:
      SA_PASSWORD: "Strong@Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "echo SELECT 1 | /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Strong@Pass123"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ProjectManagement.Api/Dockerfile
      cache_from:
        - projectmanagement-api:latest
    container_name: projectmanagement-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:80"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=ProjectManagementDb;User Id=sa;Password=Strong@Pass123;TrustServerCertificate=True;"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: unless-stopped

volumes:
  sql-data:
